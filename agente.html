<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asesor Inmobiliario | Inmoinnova Real Estate</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">

    <!-- PERFIL DEL ASESOR -->
    <header class="bg-slate-900 text-white py-16 px-4 text-center">
        <div class="max-w-4xl mx-auto">
            <div class="w-24 h-24 bg-amber-600 rounded-full mx-auto flex items-center justify-center text-3xl font-bold mb-4 shadow-lg">II</div>
            <h1 id="asesor-nombre" class="text-3xl font-bold mb-1">Cargando Asesor...</h1>
            <p id="asesor-codigo" class="text-amber-400 font-medium text-sm uppercase tracking-widest mb-4">Código: --</p>
            <div id="asesor-contactos" class="flex justify-center gap-4 text-sm"></div>
        </div>
    </header>

    <!-- PORTAFOLIO EXCLUSIVO -->
    <main class="max-w-7xl mx-auto py-16 px-4 sm:px-6 lg:px-8">
        <h2 class="text-2xl font-bold mb-8 text-slate-900">Propiedades Exclusivas del Asesor</h2>
        <div id="grid-inmuebles-asesor" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <p class="text-gray-500">Cargando propiedades...</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://kyxwiulxaazhyeqghjhh.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_3EjwKaWsoX4lKNEBk_9k6A_u3-akbu9';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function cargarDatosAgente() {
            const urlParams = new URLSearchParams(window.location.search);
            const codigoAsesor = urlParams.get('ref');

            if (!codigoAsesor) {
                document.getElementById('asesor-nombre').innerText = "Asesor no especificado";
                return;
            }

            const { data: agente, error: errAgente } = await supabaseClient
                .from('agentes')
                .select('*')
                .eq('codigo_asesor', codigoAsesor.toUpperCase())
                .eq('aprobado', true)
                .single();

            if (errAgente || !agente) {
                document.getElementById('asesor-nombre').innerText = "Asesor no encontrado o pendiente de aprobación";
                return;
            }

            document.getElementById('asesor-nombre').innerText = agente.nombre_completo;
            document.getElementById('asesor-codigo').innerText = `Código: ${agente.codigo_asesor}`;
            document.getElementById('asesor-contactos').innerHTML = `
                <a href="https://wa.me/${agente.telefono}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-medium transition">WhatsApp Directo</a>
                ${agente.instagram ? `<a href="https://instagram.com/${agente.instagram}" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-white px-5 py-2.5 rounded-xl font-medium transition">Instagram</a>` : ''}
            `;

            const { data: inmuebles, error: errInmuebles } = await supabaseClient
                .from('inmuebles')
                .select('*')
                .eq('agente_id', agente.id);

            const grid = document.getElementById('grid-inmuebles-asesor');
            if (errInmuebles || !inmuebles || inmuebles.length === 0) {
                grid.innerHTML = `<p class="text-gray-500 col-span-3 text-center py-10">Este asesor no tiene propiedades publicadas actualmente.</p>`;
                return;
            }

            grid.innerHTML = inmuebles.map(inm => `
                <div class="bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm flex flex-col">
                    <div class="relative h-56 bg-gray-200">
                        <img src="${inm.fotos_urls[0] || 'https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&q=80&w=800'}" class="w-full h-full object-cover">
                        <span class="absolute top-4 left-4 bg-slate-900/80 text-white text-xs font-semibold px-3 py-1 rounded-lg uppercase">${inm.operacion}</span>
                        <span class="absolute bottom-4 left-4 bg-amber-600 text-white font-bold text-lg px-3 py-1 rounded-lg">$${inm.precio}</span>
                    </div>
                    <div class="p-6 flex-1 flex flex-col justify-between">
                        <div>
                            <div class="text-xs text-gray-400 uppercase mb-1">${inm.ciudad}</div>
                            <h3 class="text-lg font-bold text-slate-900 mb-2">${inm.tipo.toUpperCase()} en ${inm.ciudad}</h3>
                            <p class="text-gray-600 text-sm line-clamp-3 mb-4">${inm.detalles}</p>
                        </div>
                        <a href="https://wa.me/${agente.telefono}?text=Hola,%20me%20interesa%20esta%20propiedad" target="_blank" class="w-full text-center bg-slate-900 hover:bg-amber-600 text-white py-2.5 rounded-xl text-sm transition font-medium">
                            Contactar por WhatsApp
                        </a>
                    </div>
                </div>
            `).join('');
        }

        cargarDatosAgente();
    </script>
</body>
</html>
