<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Profesional | Inmoinnova Real Estate</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Librería de compresión de imágenes de alta calidad -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/browser-image-compression/2.0.2/browser-image-compression.js"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-100 text-gray-900 antialiased min-h-screen flex flex-col justify-between">
    <div class="max-w-5xl mx-auto px-4 py-10 w-full">
        <!-- VISTA DE AUTENTICACIÓN / REGISTRO -->
        <div id="auth-section" class="bg-white p-8 rounded-2xl shadow-md max-w-md mx-auto">
            <h2 id="auth-title" class="text-2xl font-bold mb-6 text-slate-900 text-center">Acceso Asesores Inmoinnova</h2>
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div id="nombre-field" class="hidden">
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Nombre Completo</label>
                    <input type="text" id="nombre" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm">
                </div>
                <div id="codigo-field" class="hidden">
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Código de Asesor (Ej: OFVMN)</label>
                    <input type="text" id="codigo" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm uppercase">
                </div>
                <div id="telefono-field" class="hidden">
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Teléfono WhatsApp</label>
                    <input type="text" id="telefono" placeholder="+58412..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm">
                </div>
                <div id="avatar-field" class="hidden">
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Foto de Perfil del Asesor</label>
                    <input type="file" id="avatar-file" accept="image/*" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2 text-sm file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-900 file:text-white hover:file:bg-amber-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Correo Electrónico</label>
                    <input type="email" id="email" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Contraseña</label>
                    <input type="password" id="password" required class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm">
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-slate-900 hover:bg-amber-600 text-white font-semibold py-3 rounded-xl transition">Iniciar Sesión</button>
            </form>
            <p class="text-center text-xs mt-6 text-gray-500">
                <a href="#" onclick="toggleAuthMode()" id="auth-toggle-link" class="text-amber-600 font-semibold">¿No tienes cuenta? Regístrate aquí</a>
            </p>
        </div>

        <!-- PANEL DE GESTIÓN -->
        <div id="dashboard-section" class="hidden space-y-8">
            <div class="flex flex-col sm:flex-row justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-gray-100 gap-4">
                <div class="flex items-center gap-4">
                    <div id="dashboard-avatar" class="w-16 h-16 rounded-full bg-slate-200 overflow-hidden flex items-center justify-center font-bold text-slate-700 shadow-inner border-2 border-amber-500">II</div>
                    <div>
                        <h1 id="welcome-msg" class="text-xl font-bold">Bienvenido</h1>
                        <p id="estatus-msg" class="text-xs text-amber-600 font-semibold mt-1">Estatus: Verificando...</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                    <label class="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-800 px-4 py-2 rounded-xl text-xs font-medium transition shadow-xs flex items-center gap-2">
                        📷 Cambiar Foto
                        <input type="file" id="nuevo-avatar-file" accept="image/*" class="hidden" onchange="actualizarFotoPerfil(event)">
                    </label>
                    <button onclick="logout()" class="bg-red-50 text-red-600 hover:bg-red-100 px-4 py-2 rounded-xl text-xs font-medium transition">Cerrar Sesión</button>
                </div>
            </div>

            <!-- FORMULARIO DE CARGA / EDICIÓN DE INMUEBLES -->
            <div id="panel-carga" class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 hidden">
                <h3 id="form-title" class="text-lg font-bold mb-4">Registrar Nuevo Inmueble</h3>
                <form onsubmit="guardarInmueble(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="hidden" id="edit-inmueble-id">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Operación</label>
                        <select id="inm-operacion" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                            <option value="venta">Venta</option>
                            <option value="alquiler">Alquiler</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Tipo de Inmueble (Texto Libre)</label>
                        <input type="text" id="inm-tipo" required placeholder="Ej: Apartamento, Quinta, Townhouse, Local" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Ciudad / Zona</label>
                        <input type="text" id="inm-ciudad" required placeholder="Ej: El Bosque, Valencia" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Precio ($)</label>
                        <input type="number" id="inm-precio" required placeholder="50000" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Fotos del Inmueble (Hasta 30 fotos con compresión inteligente)</label>
                        <input type="file" id="inm-fotos" accept="image/*" multiple class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-900 file:text-white hover:file:bg-amber-600">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Enlace de Video (Instagram Reel / YouTube opcional)</label>
                        <input type="url" id="inm-video" placeholder="https://www.instagram.com/reel/..." class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Descripción Completa (Ficha)</label>
                        <textarea id="inm-detalles" rows="4" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm" placeholder="Detalle completo del inmueble..."></textarea>
                    </div>
                    <div class="md:col-span-2 flex gap-4">
                        <button type="submit" id="btn-guardar" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white font-semibold py-3 rounded-xl transition shadow-md">Guardar Inmueble</button>
                        <button type="button" onclick="resetFormulario()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-3 rounded-xl transition">Cancelar</button>
                    </div>
                </form>
            </div>

            <!-- MIS INMUEBLES -->
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold">Mis Inmuebles</h3>
                    <button onclick="mostrarFormularioCrear()" id="btn-nuevo-inm" class="hidden bg-slate-900 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-amber-600 transition shadow">+ Nuevo Inmueble</button>
                </div>
                <div id="mis-inmuebles-list" class="space-y-4">
                    <p class="text-gray-500 text-sm">Cargando inventario...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://kyxwiulxaazhyeqghjhh.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_3EjwKaWsoX4lKNEBk_9k6A_u3-akbu9';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isRegistering = false;
        let currentUser = null;
        let currentAgente = null;

        function toggleAuthMode() {
            isRegistering = !isRegistering;
            document.getElementById('auth-title').innerText = isRegistering ? "Registro de Nuevo Asesor" : "Acceso Asesores Inmoinnova";
            document.getElementById('auth-btn').innerText = isRegistering ? "Registrarse" : "Iniciar Sesión";
            document.getElementById('auth-toggle-link').innerText = isRegistering ? "¿Ya tienes cuenta? Inicia sesión" : "¿No tienes cuenta? Regístrate aquí";
            document.getElementById('nombre-field').classList.toggle('hidden', !isRegistering);
            document.getElementById('codigo-field').classList.toggle('hidden', !isRegistering);
            document.getElementById('telefono-field').classList.toggle('hidden', !isRegistering);
            document.getElementById('avatar-field').classList.toggle('hidden', !isRegistering);
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (isRegistering) {
                const nombre = document.getElementById('nombre').value;
                const codigo = document.getElementById('codigo').value.toUpperCase();
                const telefono = document.getElementById('telefono').value;
                const avatarInput = document.getElementById('avatar-file');
                let foto_perfil_url = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=200";

                const { data, error } = await supabaseClient.auth.signUp({ email, password });
                if (error) { alert("Error: " + error.message); return; }

                if (data.user && avatarInput.files.length > 0) {
                    const file = avatarInput.files[0];
                    const formData = new FormData();
                    formData.append('files', file);

                    try {
                        const response = await fetch(`${SUPABASE_URL}/functions/v1/upload-r2`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${data.session ? data.session.access_token : ''}` },
                            body: formData
                        });
                        const result = await response.json();
                        if (response.ok && result.urls && result.urls.length > 0) {
                            foto_perfil_url = result.urls[0];
                        }
                    } catch (e) {
                        console.log("No se pudo subir el avatar en R2, usando por defecto.");
                    }
                }

                const { error: errPerfil } = await supabaseClient.from('agentes').insert([{
                    id: data.user.id,
                    email,
                    nombre_completo: nombre,
                    codigo_asesor: codigo,
                    telefono,
                    foto_perfil_url,
                    aprobado: false
                }]);

                if (errPerfil) { alert("Error perfil: " + errPerfil.message); return; }
                alert("¡Registro exitoso! Pendiente de aprobación por el Bróker.");
                location.reload();
            } else {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) { alert("Credenciales incorrectas: " + error.message); return; }
                verificarSesion();
            }
        }

        async function verificarSesion() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return;

            currentUser = session.user;
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');

            const { data: agente } = await supabaseClient.from('agentes').select('*').eq('id', currentUser.id).single();
            currentAgente = agente;

            if (!agente) {
                document.getElementById('welcome-msg').innerText = "Perfil no encontrado.";
                return;
            }

            document.getElementById('welcome-msg').innerText = `Hola, ${agente.nombre_completo} (${agente.codigo_asesor})`;
            if (agente.foto_perfil_url) {
                document.getElementById('dashboard-avatar').innerHTML = `<img src="${agente.foto_perfil_url}" class="w-full h-full object-cover">`;
            }
            
            if (agente.aprobado) {
                document.getElementById('estatus-msg').innerText = "Estatus: Aprobado Activo ✅";
                document.getElementById('panel-carga').classList.remove('hidden');
                document.getElementById('btn-nuevo-inm').classList.remove('hidden');
                cargarMisInmuebles();
            } else {
                document.getElementById('estatus-msg').innerText = "Estatus: Pendiente de aprobación por el Bróker ⏳";
            }
        }

        async function actualizarFotoPerfil(event) {
            const file = event.target.files[0];
            if (!file) return;

            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                const formData = new FormData();
                formData.append('files', file);

                const response = await fetch(`${SUPABASE_URL}/functions/v1/upload-r2`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${session.access_token}` },
                    body: formData
                });

                const result = await response.json();
                if (!response.ok || !result.urls || result.urls.length === 0) {
                    throw new Error(result.error || 'No se pudo subir la nueva foto.');
                }

                const nuevaUrl = result.urls[0];

                // Si tenía foto anterior en R2 y no es la de Unsplash, podemos limpiarla opcionalmente
                if (currentAgente.foto_perfil_url && currentAgente.foto_perfil_url.includes(' R2 endpoint ')) {
                    await borrarLoteDeR2([currentAgente.foto_perfil_url]);
                }

                const { error } = await supabaseClient.from('agentes').update({ foto_perfil_url: nuevaUrl }).eq('id', currentAgente.id);
                if (error) throw error;

                alert("¡Foto de perfil actualizada con éxito!");
                verificarSesion();
            } catch (err) {
                alert("Error al actualizar la foto: " + err.message);
            }
        }

        async function cargarMisInmuebles() {
            const { data: inmuebles } = await supabaseClient.from('inmuebles').select('*').eq('agente_id', currentAgente.id);
            const list = document.getElementById('mis-inmuebles-list');

            if (!inmuebles || inmuebles.length === 0) {
                list.innerHTML = `<p class="text-gray-500 text-sm">No tienes inmuebles registrados.</p>`;
                return;
            }

            list.innerHTML = inmuebles.map(inm => `
                <div class="p-4 bg-gray-50 rounded-xl border border-gray-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                        <span class="text-xs font-semibold uppercase px-2 py-1 bg-amber-100 text-amber-800 rounded">${inm.operacion}</span>
                        <h4 class="font-bold text-slate-900 mt-2">${inm.tipo.toUpperCase()} en ${inm.ciudad} - $${inm.precio}</h4>
                        <p class="text-xs text-gray-500 line-clamp-1 mt-1">${inm.detalles}</p>
                    </div>
                    <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                        <button onclick='copiarFichaYNavegar(${JSON.stringify(inm.detalles)})' class="bg-slate-900 text-white px-3 py-2 rounded-lg text-xs font-medium hover:bg-amber-600 transition">Copiar Ficha</button>
                        <button onclick='descargarLoteFotos(${JSON.stringify(inm.fotos_urls)}, ${JSON.stringify(inm.detalles)})' class="bg-emerald-600 text-white px-3 py-2 rounded-lg text-xs font-medium hover:bg-emerald-700 transition">Descargar Fotos</button>
                        <button onclick='editarInmueble("${inm.id}", ${JSON.stringify(inm)})' class="bg-gray-200 text-gray-700 px-3 py-2 rounded-lg text-xs font-medium hover:bg-gray-300 transition">Editar</button>
                        <button onclick='eliminarInmueble("${inm.id}")' class="bg-red-100 text-red-600 px-3 py-2 rounded-lg text-xs font-medium hover:bg-red-200 transition">Eliminar</button>
                    </div>
                </div>
            `).join('');
        }

        function copiarFichaYNavegar(detalles) {
            navigator.clipboard.writeText(detalles);
            alert("¡Ficha descriptiva copiada al portapapeles con éxito!");
        }

        async function descargarLoteFotos(urls, detalles) {
            if (!urls || urls.length === 0) { alert("Este inmueble no tiene fotos."); return; }
            navigator.clipboard.writeText(detalles);
            alert(`Copiando ficha al portapapeles y abriendo ${urls.length} fotos en alta calidad para descarga.`);
            urls.forEach(url => window.open(url, '_blank'));
        }

        function mostrarFormularioCrear() {
            document.getElementById('form-title').innerText = "Registrar Nuevo Inmueble";
            document.getElementById('edit-inmueble-id').value = "";
            resetFormulario();
            document.getElementById('panel-carga').scrollIntoView({ behavior: 'smooth' });
        }

        function editarInmueble(id, inm) {
            document.getElementById('form-title').innerText = "Editar Inmueble";
            document.getElementById('edit-inmueble-id').value = id;
            document.getElementById('inm-operacion').value = inm.operacion;
            document.getElementById('inm-tipo').value = inm.tipo;
            document.getElementById('inm-ciudad').value = inm.ciudad;
            document.getElementById('inm-precio').value = inm.precio;
            document.getElementById('inm-video').value = inm.video_url || "";
            document.getElementById('inm-detalles').value = inm.detalles;
            document.getElementById('panel-carga').scrollIntoView({ behavior: 'smooth' });
        }

        function resetFormulario() {
            document.getElementById('edit-inmueble-id').value = "";
            document.getElementById('inm-tipo').value = "";
            document.getElementById('inm-ciudad').value = "";
            document.getElementById('inm-precio').value = "";
            document.getElementById('inm-video').value = "";
            document.getElementById('inm-detalles').value = "";
            document.getElementById('inm-fotos').value = "";
        }

        async function borrarLoteDeR2(urls) {
            if (!urls || urls.length === 0) return;
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                await fetch(`${SUPABASE_URL}/functions/v1/delete-r2`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${session.access_token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ urls })
                });
            } catch (e) {
                console.log("Error al limpiar archivos en R2:", e);
            }
        }

        async function guardarInmueble(event) {
            event.preventDefault();
            const id = document.getElementById('edit-inmueble-id').value;
            const operacion = document.getElementById('inm-operacion').value;
            const tipo = document.getElementById('inm-tipo').value.trim();
            const ciudad = document.getElementById('inm-ciudad').value;
            const precio = parseFloat(document.getElementById('inm-precio').value);
            const video_url = document.getElementById('inm-video').value;
            const detalles = document.getElementById('inm-detalles').value;
            const fileInput = document.getElementById('inm-fotos');
            
            const btnGuardar = document.getElementById('btn-guardar');
            btnGuardar.disabled = true;

            try {
                let fotos_urls = [];
                let fotosAntiguas = [];

                if (id) {
                    const { data: antiguo } = await supabaseClient.from('inmuebles').select('fotos_urls').eq('id', id).single();
                    if (antiguo && antiguo.fotos_urls) {
                        fotosAntiguas = antiguo.fotos_urls;
                        fotos_urls = [...fotosAntiguas];
                    }
                }

                if (fileInput.files.length > 0) {
                    if (fileInput.files.length > 30) {
                        alert("Máximo 30 fotos permitidas por inmueble.");
                        btnGuardar.disabled = false;
                        return;
                    }

                    const { data: { session } } = await supabaseClient.auth.getSession();
                    let nuevasFotos = [];
                    
                    for (let i = 0; i < fileInput.files.length; i++) {
                        btnGuardar.innerText = `Comprimiendo y subiendo foto ${i + 1} de ${fileInput.files.length}...`;
                        let file = fileInput.files[i];

                        const options = { maxSizeMB: 0.8, maxWidthOrHeight: 1920, useWebWorker: true };
                        try { file = await imageCompression(file, options); } catch (e) {}

                        const formData = new FormData();
                        formData.append('files', file);

                        const response = await fetch(`${SUPABASE_URL}/functions/v1/upload-r2`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${session.access_token}` },
                            body: formData
                        });

                        const result = await response.json();
                        if (!response.ok) throw new Error(result.error || `Error al subir imagen ${i + 1}`);
                        if (result.urls && result.urls.length > 0) {
                            nuevasFotos.push(result.urls[0]);
                        }
                    }

                    if (id && fotosAntiguas.length > 0) {
                        await borrarLoteDeR2(fotosAntiguas);
                    }
                    fotos_urls = nuevasFotos;
                }

                if (fotos_urls.length === 0) {
                    fotos_urls = ["https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&q=80&w=800"];
                }

                if (id) {
                    const { error } = await supabaseClient.from('inmuebles').update({ operacion, tipo, ciudad, precio, video_url, detalles, fotos_urls }).eq('id', id);
                    if (error) throw error;
                    alert("¡Inmueble actualizado con éxito y archivos sincronizados!");
                } else {
                    const { error } = await supabaseClient.from('inmuebles').insert([{ 
                        agente_id: currentAgente.id, 
                        operacion, tipo, ciudad, precio, video_url, detalles, fotos_urls 
                    }]);
                    if (error) throw error;
                    alert("¡Inmueble registrado con éxito!");
                }

                resetFormulario();
                cargarMisInmuebles();
            } catch (err) {
                alert("Error al procesar: " + err.message);
            } finally {
                btnGuardar.innerText = "Guardar Inmueble";
                btnGuardar.disabled = false;
            }
        }

        async function eliminarInmueble(id) {
            if (!confirm("¿Estás seguro de eliminar este inmueble? Se borrarán sus datos y se limpiarán los archivos de la nube.")) return;
            
            const { data: inmueble } = await supabaseClient.from('inmuebles').select('fotos_urls').eq('id', id).single();
            if (inmueble && inmueble.fotos_urls) {
                await borrarLoteDeR2(inmueble.fotos_urls);
            }

            const { error } = await supabaseClient.from('inmuebles').delete().eq('id', id);
            if (error) { alert("Error al eliminar: " + error.message); return; }
            alert("Inmueble y archivos eliminados por completo sin dejar rastro.");
            cargarMisInmuebles();
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        verificarSesion();
    </script>
</body>
